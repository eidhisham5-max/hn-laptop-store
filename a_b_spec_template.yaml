## Example Calculation

### Step-by-Step Sample Size Calculation
example_calculation:
  given:
    p1: 0.02
    p2: 0.025
    alpha: 0.05
    power: 0.80
  
  step_1:
    description: "Calculate pooled proportion"
    calculation: "p̄ = (0.02 + 0.025) / 2 = 0.0225"
  
  step_2:
    description: "Calculate Z-scores"
    calculation: "Z_α/2 = 1.96, Z_β = 0.84"
  
  step_3:
    description: "Calculate variance terms"
    calculation: "sqrt(2 * 0.0225 * 0.9775) = 0.209761"
  
  step_4:
    description: "Calculate individual variances"
    calculation: "sqrt(0.0196 + 0.024375) = 0.209691"
  
  step_5:
    description: "Calculate sample size per variant"
    calculation: "n = (1.96 * 0.209761 + 0.84 * 0.209691)² / (0.005)² = 13,795"
  
  step_6:
    description: "Calculate total sample size"
    calculation: "Total = 13,795 * 2 = 27,590 visitors"
  
  step_7:
    description: "Calculate test duration"
    calculation: "Duration = 27,590 / 2,000 daily visitors = 13.8 days"

